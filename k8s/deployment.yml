apiVersion: apps/v1
kind: Deployment
metadata:
  name: hireflow-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hireflow
  template:
    metadata:
      labels:
        app: hireflow
    spec:
      containers:
        - name: hireflow
          image: samruddhi0411/hireflow:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
